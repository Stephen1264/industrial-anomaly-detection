name: Part D unified evaluation
on:
  push:
    branches: [part-d-evaluation]
    paths: ['part_d/evaluate.py', 'part_d/metrics.py', 'part_d/cases.py', 'part_d/inputs.json', 'part_d/protocol.md', 'part_d/prepare_inputs.py', '.github/workflows/part-d-evaluation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the CPU scoring environment
        run: |
          python -m pip install --quiet -r part_d/requirements.txt
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.9.1
      - name: Check the evaluator and verify A, B and C releases
        run: |
          python -m unittest discover -s part_d -p test_metrics.py
          python part_d/prepare_inputs.py "$RUNNER_TEMP/iad-inputs"
      - name: Freeze normal-validation thresholds before D test inference
        run: python part_d/evaluate.py lock --inputs "$RUNNER_TEMP/iad-inputs" --out build/project
      - name: Score 594 independent test images and compute exact native-grid AUROC
        run: python -u part_d/evaluate.py test --inputs "$RUNNER_TEMP/iad-inputs" --out build/project
      - name: Render paired cases
        run: python part_d/cases.py --inputs "$RUNNER_TEMP/iad-inputs" --out build/project
      - uses: actions/upload-artifact@v4
        with:
          name: part-d-evaluated
          path: build/project
          if-no-files-found: error
          retention-days: 14
